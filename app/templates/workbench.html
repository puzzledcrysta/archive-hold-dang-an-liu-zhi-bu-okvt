<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>档案留置簿</title>
  <link rel="stylesheet" href="/static/theme.css">
  <link rel="stylesheet" href="/static/records.css">
  <script type="module" src="/static/workspace.js"></script>
</head>
<body class="records">
  <div class="workbench">
    <aside class="rail">
      <a class="brand" href="/"><span aria-hidden="true">⌑</span><b>档案留置簿</b></a>
      <nav aria-label="业务模块">
        {% for slug, label in tabs.items() %}<a href="#{{ slug }}" data-module="{{ slug }}">{{ label }}</a>{% endfor %}
      </nav>
      <small>企业档案室保管员</small>
    </aside>
    <div class="desk">
      <header class="toolbar"><span>档案件</span><span class="edition">规则 1.0</span><a class="btn" id="export" hidden>导出证据</a></header>
      <main>
        <section class="mast"><div><small class="department">保管审查</small><h1>档案留置簿</h1></div><time id="created" class="clock"></time></section>
        <section class="kpis" aria-label="批次指标"><div class="kpi"><small>来源记录</small><strong data-count="input">—</strong><span>条</span></div>
<div class="kpi"><small>隔离</small><strong data-count="rejected">—</strong><span>条</span></div>
<div class="kpi"><small>有效</small><strong data-count="accepted">—</strong><span>条</span></div>
<div class="kpi"><small>账差</small><strong data-count="mismatched">—</strong><span>条</span></div>
<div class="kpi"><small>净差</small><strong data-count="delta">—</strong><span>天</span></div>
        </section>
        <div class="grid">
    <article class="panel signal" id="evidence-panel" data-instrument="receipt">
      <div class="panel__head"><h2>政策与留置</h2><span class="num" id="evidence-key"></span></div>
      <div class="panel__body" id="signal" aria-live="polite"><p class="empty">选择一条复算记录</p></div>
    </article>

    <section class="panel results" aria-labelledby="phase">
      <div class="panel__head"><h2 id="phase">处置日期</h2><span class="num" id="run-id"></span></div>
      <div id="tools" class="filters" hidden><label>筛选 <input id="filter" type="search" placeholder="档案件 / 原因" maxlength="80"></label>
        <label id="only-differences" hidden><input id="differences" type="checkbox"> 只看差异</label><output id="shown"></output></div>
      <div class="scroll" id="grid-data"><p class="empty">运行本班样例</p></div>
      <form id="review" class="panel__body" hidden>
        <label>复核意见 <textarea id="review-note" maxlength="500" rows="2"></textarea></label>
        <div class="actions"><label>结论 <select id="decision"><option>确认</option><option>退回</option></select></label>
        <button class="btn btn--primary" type="submit">提交复核</button></div>
      </form>
    </section>

    <section class="panel source" aria-labelledby="input-title">
      <div class="panel__head"><h2 id="input-title">案件底档</h2><small>CSV</small></div>
      <form id="source" class="panel__body">
        <div class="actions"><button type="submit" class="btn btn--primary">运行处置日期</button>
        <button type="button" id="sample" class="btn">载入样例</button></div>
        <details><summary>导入来源与外部账</summary>
          <label>来源文件 <input id="source-file" type="file" accept=".csv,text/csv"></label>
          <textarea id="source-csv" aria-label="原始记录 CSV" rows="4"></textarea>
          <label>外部账 <input id="book-file" type="file" accept=".csv,text/csv"></label>
          <textarea id="book-csv" aria-label="外部账 CSV" rows="4"></textarea>
        </details>
        <output id="notice" role="status"></output>
      </form>
    </section></div>
      <section class="panel release-desk" id="release-panel" hidden aria-labelledby="release-title">
        <div class="panel__head"><h2 id="release-title">年限切换 · 可放行名单</h2><span class="num" id="release-id"></span></div>
        <div class="panel__body">
          <form id="release-form">
            <label>生效日 <input id="effective-date" type="date" value="2026-01-01" required></label>
            <label>修订表（档案件,状态,保管政策）
              <textarea id="revision-csv" aria-label="年限修订 CSV" rows="5"></textarea>
            </label>
            <div class="actions">
              <button type="submit" class="btn btn--primary">生成切换名单</button>
              <button type="button" id="release-switch" class="btn" hidden>切换为有效名单</button>
              <button type="button" id="release-rollback" class="btn">恢复旧版名单</button>
            </div>
          </form>
          <div id="release-summary" class="kpis" aria-label="名单指标"></div>
          <div class="scroll" id="release-grid"><p class="empty">生成名单后逐件查看采用的年限版本</p></div>
          <output id="release-notice" role="status"></output>
        </div>
      </section>
      </main>
      <footer class="statusbar"><span id="state" role="status">等待输入</span><a href="/openapi.json">接口</a><span>UTC</span></footer>
    </div>
  </div>
  <script type="application/json" id="settings">{{ {'reasons': reasons, 'tabs': tabs, 'unit': unit, 'key': key}|tojson }}</script>
</body>
</html>
